<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SerialTerminal 活跃度统计</title>
  <link rel="stylesheet" href="/serialterminal/admin/dashboard.css?v=3">
  <script src="/serialterminal/admin/dashboard.js?v=3" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SerialTerminal</p>
      <h1>活跃设备</h1>
    </div>
    <div class="toolbar">
      <div class="period" role="group" aria-label="统计周期">
        <button data-days="7">7 天</button>
        <button class="active" data-days="30">30 天</button>
        <button data-days="90">90 天</button>
      </div>
      <button id="logout" class="secondary">退出</button>
    </div>
  </header>
  <main>
    <section class="metrics" aria-label="核心指标">
      <article><span>今日活跃</span><strong id="dau">-</strong><small>DAU</small></article>
      <article><span>最近 7 日</span><strong id="wau">-</strong><small>WAU</small></article>
      <article><span>最近 30 日</span><strong id="mau">-</strong><small>MAU</small></article>
      <article><span>总装机数</span><strong id="total">-</strong><small>唯一安装实例</small></article>
      <article><span>今日新增</span><strong id="new-today">-</strong><small>首次上报</small></article>
    </section>
    <section class="update-policies-section" aria-labelledby="update-policies-title">
      <div class="section-heading">
        <div><p class="eyebrow">Update Delivery</p><h2 id="update-policies-title">动态更新策略</h2></div>
        <div class="policy-heading-actions">
          <span id="update-policies-summary">正在加载</span>
          <button id="new-policy" type="button">新建策略</button>
        </div>
      </div>
      <div class="policy-table-wrap">
        <table class="policy-table">
          <thead>
            <tr><th>状态</th><th>匹配范围</th><th>优先级</th><th>元数据地址</th><th>最后更新</th><th><span class="visually-hidden">操作</span></th></tr>
          </thead>
          <tbody id="update-policies"></tbody>
        </table>
      </div>
      <form id="update-policy-form" class="policy-editor" hidden>
        <input name="policyId" type="hidden">
        <div class="policy-editor-heading">
          <h3 id="policy-editor-title">新建策略</h3>
          <span id="policy-editor-meta"></span>
        </div>
        <div class="policy-form-grid">
          <label class="full-field">更新元数据地址
            <input name="metadataUrl" type="url" inputmode="url" required spellcheck="false" autocomplete="off" placeholder="https://example.com/releases/latest/latest.yml">
          </label>
          <label>渠道
            <input name="channel" type="text" maxlength="80" spellcheck="false" autocomplete="off" placeholder="全部渠道">
          </label>
          <label>优先级
            <input name="priority" type="number" min="-2147483648" max="2147483647" step="1" required value="0">
          </label>
          <label>最低客户端版本
            <input name="minClientVersion" type="text" inputmode="text" pattern="[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?" spellcheck="false" autocomplete="off" placeholder="不限制">
          </label>
          <label>最高客户端版本
            <input name="maxClientVersion" type="text" inputmode="text" pattern="[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?" spellcheck="false" autocomplete="off" placeholder="不限制">
          </label>
        </div>
        <div class="policy-toggles">
          <label><input name="enabled" type="checkbox" checked><span>启用策略</span></label>
          <label><input name="legacy" type="checkbox"><span>旧客户端默认策略</span></label>
          <span id="legacy-policy-note" class="policy-note"></span>
        </div>
        <div class="policy-form-actions">
          <button type="submit">创建策略</button>
          <button id="cancel-policy" class="inline-secondary" type="button">取消</button>
          <p id="policy-form-status" class="form-status" aria-live="polite"></p>
        </div>
      </form>
    </section>
    <section class="trend-section">
      <div class="section-heading">
        <div><p class="eyebrow">Activity</p><h2>每日活跃趋势</h2></div>
        <span id="updated-at">正在加载</span>
      </div>
      <svg id="activity-chart" viewBox="0 0 1000 320" role="img" aria-label="每日活跃设备趋势图"></svg>
    </section>
    <section class="breakdowns">
      <div><p class="eyebrow">Installations</p><h2>当前版本装机数</h2><div id="versions" class="bars"></div></div>
      <div><p class="eyebrow">Platforms</p><h2>平台分布</h2><div id="platforms" class="bars"></div></div>
      <div><p class="eyebrow">Architecture</p><h2>架构分布</h2><div id="architectures" class="bars"></div></div>
    </section>
    <section class="recent-section">
      <div class="section-heading">
        <div><p class="eyebrow">Recent Reports</p><h2>最近上传</h2></div>
        <span>最多显示 50 条</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>上报时间</th><th>匿名安装</th><th>版本</th><th>平台</th><th>架构</th></tr>
          </thead>
          <tbody id="recent-activity"></tbody>
        </table>
      </div>
    </section>
    <p id="error" class="error" hidden></p>
  </main>
</body>
</html>
