version: '1.0'
name: gitee-release
displayName: Gitee Release
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
        - '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$'
stages:
  - name: publish
    displayName: 发布 Windows 安装包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: mirror_github_release
        displayName: 镜像 GitHub Release
        nodeVersion: 14.16.0
        commands:
          - |
            set -eu
            NODE_ARCHIVE="node-v22.12.0-linux-x64.tar.xz"
            curl --fail --location --retry 3 --output "/tmp/$NODE_ARCHIVE" "https://npmmirror.com/mirrors/node/v22.12.0/$NODE_ARCHIVE"
            echo "22982235e1b71fa8850f82edd09cdae7e3f32df1764a9ec298c72d25ef2c164f  /tmp/$NODE_ARCHIVE" | sha256sum --check
            tar --extract --xz --file "/tmp/$NODE_ARCHIVE" --directory /tmp
            export PATH="/tmp/node-v22.12.0-linux-x64/bin:$PATH"
            node --version
            npm config set registry https://registry.npmmirror.com
            npm ci --ignore-scripts
            git fetch --force origin 'refs/tags/*:refs/tags/*'
            TAGS="$(git tag --points-at "$GITEE_COMMIT" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || true)"
            test "$(printf '%s\n' "$TAGS" | sed '/^$/d' | wc -l)" -eq 1
            TAG="$TAGS"
            node scripts/validate-release-tag.js "$TAG"
            GITEE_ACCESS_TOKEN="$CI_GITEE_ACCESS_TOKEN" node scripts/mirror-github-release-to-gitee.js --github-owner Trigger-CN --github-repo SerialTerminal --gitee-owner trigger-cn --gitee-repo SerialTerminal --tag "$TAG" --target "$GITEE_COMMIT" --cos-releases-root "https://tst-update-package-1316411824.cos.ap-hongkong.myqcloud.com/releases"
            VERSION="${TAG#v}"
            GITEE_RELEASE_ROOT="https://gitee.com/trigger-cn/SerialTerminal/releases/download/$TAG"
            curl --fail --location --silent --show-error --retry 3 --max-time 600 --output /tmp/latest.yml "$GITEE_RELEASE_ROOT/latest.yml"
            curl --fail --location --silent --show-error --retry 3 --max-time 1800 --output "/tmp/SerialTerminal-Setup-$VERSION.exe" "$GITEE_RELEASE_ROOT/SerialTerminal-Setup-$VERSION.exe"
            node scripts/update-artifact-integrity.js --metadata /tmp/latest.yml --installer "/tmp/SerialTerminal-Setup-$VERSION.exe" --version "$VERSION"
            curl --fail --location --silent --show-error --retry 3 --max-time 600 --range 0-0 --output /dev/null "$GITEE_RELEASE_ROOT/SerialTerminal-Setup-$VERSION.exe.blockmap"
        caches:
          - ~/.npm
        notify: []
        strategy:
          retry: '0'
notify: []
variables:
  global:
    - CI_GITEE_ACCESS_TOKEN
