name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            command: npm run dist:win
          - os: ubuntu-latest
            target: linux
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Set up MSBuild
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v2
      - name: Set up Visual Studio developer environment
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Sync package version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libfuse2
      - run: npm ci --ignore-scripts
      - name: Record lockfile after version sync
        shell: bash
        run: sha256sum package-lock.json > lockfile.sha256
      - run: npm test
      - run: npm run rebuild
      - run: ${{ matrix.command }}
      - name: Verify Windows release artifact names
        if: matrix.target == 'win'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/SerialTerminal-Setup-$VERSION.exe"
          test -f "dist/SerialTerminal-Setup-$VERSION.exe.blockmap"
          grep -F "url: SerialTerminal-Setup-$VERSION.exe" dist/latest.yml
          grep -F "path: SerialTerminal-Setup-$VERSION.exe" dist/latest.yml
      - name: Verify lockfile is unchanged
        shell: bash
        run: sha256sum --check lockfile.sha256
      - name: Upload Windows release artifacts
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: serialterminal-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - name: Upload Linux release artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: serialterminal-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          VERSION="${CURRENT_TAG#v}"
          {
            printf '# SerialTerminal %s\n\n' "$VERSION"
            printf '## Changes\n\n'
            if [ -n "$PREVIOUS_TAG" ]; then
              printf 'Changes since `%s`:\n\n' "$PREVIOUS_TAG"
              RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              printf 'Changes included in this release:\n\n'
              RANGE="${GITHUB_SHA}"
            fi

            git log "$RANGE" --pretty=format:'- %s (%h)'
            printf '\n\n'

            printf '## Downloads\n\n'
            printf '%s\n' '- Windows: installer, blockmap, and update metadata are attached below.'
            printf '%s\n' '- Linux: AppImage, deb package, and update metadata are attached below.'
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest.yml
            dist/latest-linux.yml
          fail_on_unmatched_files: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure mirror SSH
        shell: bash
        env:
          MIRROR_SSH_PRIVATE_KEY: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '43.157.13.24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJGra2UcB4l6SAhzwZkrR6uNEF6h7729fQa7JRXaHrnc' > ~/.ssh/known_hosts
      - name: Publish Windows update mirror
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version: $VERSION" >&2; exit 1; }
          TARGET="/home/ubuntu/ws/SerialTerminalPackages/incoming/$VERSION"
          scp scripts/publish-update-mirror.sh serialterminal-deploy@43.157.13.24:/home/ubuntu/ws/SerialTerminalPackages/bin/publish.new
          ssh serialterminal-deploy@43.157.13.24 "chmod 775 /home/ubuntu/ws/SerialTerminalPackages/bin/publish.new && mv -f /home/ubuntu/ws/SerialTerminalPackages/bin/publish.new /home/ubuntu/ws/SerialTerminalPackages/bin/publish"
          ssh serialterminal-deploy@43.157.13.24 "rm -rf '$TARGET' && mkdir -p '$TARGET'"
          scp dist/latest.yml dist/*.exe dist/*.exe.blockmap serialterminal-deploy@43.157.13.24:"$TARGET/"
          ssh serialterminal-deploy@43.157.13.24 "/home/ubuntu/ws/SerialTerminalPackages/bin/publish '$VERSION'"
