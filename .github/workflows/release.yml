name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            command: npm run dist:win
          - os: ubuntu-latest
            target: linux
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Set up MSBuild
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v2
      - name: Set up Visual Studio developer environment
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Sync package version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libfuse2
      - run: npm ci --ignore-scripts
      - name: Record lockfile after version sync
        shell: bash
        run: sha256sum package-lock.json > lockfile.sha256
      - run: npm test
      - run: npm run rebuild
      - run: ${{ matrix.command }} -- --publish never
      - name: Verify lockfile is unchanged
        shell: bash
        run: sha256sum --check lockfile.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: serialterminal-${{ matrix.target }}
          path: dist/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
