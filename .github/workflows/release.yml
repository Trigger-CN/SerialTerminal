name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            command: npm run dist:win
          - os: ubuntu-latest
            target: linux
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release tag
        run: node scripts/validate-release-tag.js "${{ github.ref_name }}"
      - name: Set up MSBuild
        if: matrix.os == 'windows-2022'
        uses: microsoft/setup-msbuild@v2
      - name: Set up Visual Studio developer environment
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Sync package version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Mark official release build
        shell: bash
        run: printf '%s\n' "${GITHUB_REF_NAME#v}" > release-build.txt
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libfuse2
      - run: npm ci --ignore-scripts
      - name: Record lockfile after version sync
        shell: bash
        run: sha256sum package-lock.json > lockfile.sha256
      - run: npm test
      - run: npm run rebuild
      - run: ${{ matrix.command }}
      - name: Verify Windows release artifact names
        if: matrix.target == 'win'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/SerialTerminal-Setup-$VERSION.exe"
          test -f "dist/SerialTerminal-Setup-$VERSION.exe.blockmap"
          grep -F "url: SerialTerminal-Setup-$VERSION.exe" dist/latest.yml
          grep -F "path: SerialTerminal-Setup-$VERSION.exe" dist/latest.yml
      - name: Verify lockfile is unchanged
        shell: bash
        run: sha256sum --check lockfile.sha256
      - name: Upload Windows release artifacts
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: serialterminal-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - name: Upload Linux release artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: serialterminal-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: serialterminal-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*'
          merge-multiple: true
      - name: Verify local Windows update artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-artifact-integrity.js \
            --metadata dist/latest.yml \
            --installer "dist/SerialTerminal-Setup-$VERSION.exe" \
            --version "$VERSION"
      - name: Validate GitHub release promotion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/validate-github-release.js \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --tag "${GITHUB_REF_NAME}" \
            --files \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/*.AppImage \
              dist/*.deb \
              dist/latest.yml \
              dist/latest-linux.yml
      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          VERSION="${CURRENT_TAG#v}"
          {
            printf '# SerialTerminal %s\n\n' "$VERSION"
            printf '## Changes\n\n'
            if [ -n "$PREVIOUS_TAG" ]; then
              printf 'Changes since `%s`:\n\n' "$PREVIOUS_TAG"
              RANGE="${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              printf 'Changes included in this release:\n\n'
              RANGE="${GITHUB_SHA}"
            fi

            git log "$RANGE" --pretty=format:'- %s (%h)'
            printf '\n\n'

            printf '## Downloads\n\n'
            COS_ROOT='https://tst-update-package-1316411824.cos.ap-hongkong.myqcloud.com/releases'
            printf '%s\n' "- Windows: [installer]($COS_ROOT/$CURRENT_TAG/SerialTerminal-Setup-$VERSION.exe)"
            printf '%s\n' "- Linux: Download the AppImage or deb package from this GitHub Release."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest.yml
            dist/latest-linux.yml
          fail_on_unmatched_files: true
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release artifacts to COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          node scripts/publish-cos-release.js \
            --tag "${GITHUB_REF_NAME}" \
            --files \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/latest.yml
      - name: Verify public COS downloads
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COS_ROOT="https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/releases"
          RELEASE_ROOT="$COS_ROOT/${GITHUB_REF_NAME}"
          curl --fail --silent --show-error --retry 3 --max-time 600 --output /tmp/latest.yml "$RELEASE_ROOT/latest.yml"
          curl --fail --silent --show-error --retry 3 --max-time 1800 --output "/tmp/SerialTerminal-Setup-$VERSION.exe" \
            "$RELEASE_ROOT/SerialTerminal-Setup-$VERSION.exe"
          node scripts/update-artifact-integrity.js \
            --metadata /tmp/latest.yml \
            --installer "/tmp/SerialTerminal-Setup-$VERSION.exe" \
            --version "$VERSION"
      - name: Promote verified GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/validate-github-release.js \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --tag "${GITHUB_REF_NAME}" \
            --promote \
            --files \
              dist/*.exe \
              dist/*.exe.blockmap \
              dist/*.AppImage \
              dist/*.deb \
              dist/latest.yml \
              dist/latest-linux.yml
      - name: Configure Gitee SSH
        shell: bash
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/gitee_ed25519
          chmod 600 ~/.ssh/gitee_ed25519
          printf '%s\n' \
            'Host gitee.com' \
            '  HostName gitee.com' \
            '  User git' \
            '  IdentityFile ~/.ssh/gitee_ed25519' \
            '  IdentitiesOnly yes' > ~/.ssh/config
          printf '%s\n' 'gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN' > ~/.ssh/known_hosts
      - name: Synchronize release commit and tag to Gitee
        shell: bash
        run: |
          git remote add gitee git@gitee.com:trigger-cn/SerialTerminal.git
          git push gitee "${GITHUB_SHA}:refs/heads/main"
          git push gitee "refs/tags/${GITHUB_REF_NAME}"
      - name: Wait for and verify public Gitee release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GITEE_RELEASE_ROOT="https://gitee.com/trigger-cn/SerialTerminal/releases/download/${GITHUB_REF_NAME}"
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error --connect-timeout 5 --max-time 10 \
              --output /tmp/gitee-latest.yml "$GITEE_RELEASE_ROOT/latest.yml"; then
              break
            fi
            rm -f /tmp/gitee-latest.yml
            if [ "$attempt" -eq 60 ]; then
              echo "Gitee release did not become available within 15 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --location --silent --show-error --retry 3 --max-time 1800 \
            --output "/tmp/SerialTerminal-Setup-$VERSION.exe" \
            "$GITEE_RELEASE_ROOT/SerialTerminal-Setup-$VERSION.exe"
          curl --fail --location --silent --show-error --retry 3 --max-time 600 --range 0-0 \
            --output /dev/null "$GITEE_RELEASE_ROOT/SerialTerminal-Setup-$VERSION.exe.blockmap"
          node scripts/update-artifact-integrity.js \
            --metadata /tmp/gitee-latest.yml \
            --installer "/tmp/SerialTerminal-Setup-$VERSION.exe" \
            --version "$VERSION"
      - name: Promote stable COS latest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node scripts/publish-cos-release.js --promote-latest --tag "${GITHUB_REF_NAME}"
      - name: Verify stable COS latest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COS_ROOT="https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/releases/latest"
          curl --fail --silent --show-error --retry 3 --max-time 600 --output /tmp/cos-stable-latest.yml "$COS_ROOT/latest.yml"
          curl --fail --silent --show-error --retry 3 --max-time 1800 \
            --output "/tmp/cos-stable-SerialTerminal-Setup-$VERSION.exe" \
            "https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/releases/${GITHUB_REF_NAME}/SerialTerminal-Setup-$VERSION.exe"
          node scripts/update-artifact-integrity.js \
            --metadata /tmp/cos-stable-latest.yml \
            --installer "/tmp/cos-stable-SerialTerminal-Setup-$VERSION.exe" \
            --version "$VERSION"
      - name: Remove old COS releases
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node scripts/publish-cos-release.js --prune-only
