<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Update</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: #252526; color: #f1f1f1; font: 13px "Segoe UI", sans-serif; }
        #status { margin-bottom: 14px; }
        #progress-track { height: 8px; overflow: hidden; border-radius: 4px; background: #404040; }
        #progress-fill { width: 0; height: 100%; background: #4da3ff; transition: width 120ms linear; }
        #details { margin-top: 10px; color: #bdbdbd; }
        #manual-download { margin-top: 14px; color: #bdbdbd; line-height: 1.4; }
        #manual-download a { color: #4da3ff; }
        #install-btn { display: none; margin-top: 20px; padding: 8px 14px; border: 0; border-radius: 3px; background: #4da3ff; color: #fff; cursor: pointer; }
        #install-btn:hover { background: #6db5ff; }
    </style>
</head>
<body>
    <div id="status"></div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="details"></div>
    <div id="manual-download"><span id="manual-download-hint"></span> <a id="manual-download-link" href="#"></a></div>
    <button id="install-btn" type="button"></button>
    <script src="update-progress.js"></script>
</body>
</html>
