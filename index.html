<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SerialTerminal by Trigger-CN</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="material-icons.js"></script>
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-collapsed-toolbar" aria-label="Quick tools" data-i18n-aria-label="main.sidebarQuickTools">
            <div class="sidebar-throughput-compact" id="sidebar-throughput-compact" aria-label="Serial throughput">
                <div class="sidebar-throughput-item rx" title="RX">
                    <span class="sidebar-throughput-label">RX</span>
                    <span class="sidebar-throughput-value" id="sidebar-throughput-rx">0 B/s</span>
                </div>
                <div class="sidebar-throughput-item tx" title="TX">
                    <span class="sidebar-throughput-label">TX</span>
                    <span class="sidebar-throughput-value" id="sidebar-throughput-tx">0 B/s</span>
                </div>
            </div>
            <div class="sidebar-quick-send-scroll">
                <div id="sidebar-quick-send-list" class="sidebar-quick-send-list" role="list" aria-label="Quick send shortcuts" data-i18n-aria-label="main.quickSendShortcuts"></div>
            </div>
            <div class="sidebar-fixed-tools">
                <button id="sidebar-connect-btn" class="sidebar-tool-btn connect-action" title="Connect" data-i18n-title="main.connect" aria-label="Connect"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="power"></span></button>
                <button id="sidebar-clear-btn" class="sidebar-tool-btn" title="Clear Terminal Output" data-i18n-title="main.clearTerminalOutput" aria-label="Clear Terminal Output"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="delete_sweep"></span></button>
                <button id="sidebar-prefs-btn" class="sidebar-tool-btn" title="Settings" data-i18n-title="main.globalSettings" aria-label="Settings"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="settings"></span></button>
                <button id="sidebar-input-btn" class="sidebar-tool-btn" title="Show/hide input bar" data-i18n-title="main.toggleInputHide" aria-label="Show/hide input bar"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="keyboard"></span></button>
                <button id="sidebar-shell-btn" class="sidebar-tool-btn" title="Shell Panel" data-i18n-title="main.shellPanel" aria-label="Shell Panel"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="terminal"></span></button>
            </div>
            <button id="sidebar-expand-btn" class="sidebar-tool-btn" title="Expand sidebar" data-i18n-title="main.expandSidebar" aria-label="Expand sidebar"><span class="material-icon-placeholder sidebar-tool-icon" data-material-icon="double_arrow"></span></button>
        </div>
        <!-- Persistent Header -->
        <div class="sidebar-header">
            <div style="display: flex; gap: 4px;">
                <select id='port-select' title='Select Serial Port' data-i18n-title='main.selectSerialPort' style='flex: 1; width: 0;'>
                    <option value='' data-i18n='main.selectPort'>Select Port</option>
                </select>
                <button class="secondary" id="refresh-btn" style="flex: 0 0 auto; padding: 0 8px;" title="Refresh Ports" data-i18n-title="main.refreshPorts"><span class="material-icon-placeholder" data-material-icon="refresh"></span></button>
            </div>

            <div id="baud-container" style="position: relative;">
                <select id="baud-select" title="Select Baud Rate" data-i18n-title="main.baudRate" style="width: 100%;">
                    <option value="110">110</option>
                    <option value="300">300</option>
                    <option value="600">600</option>
                    <option value="1200">1200</option>
                    <option value="2400">2400</option>
                    <option value="4800">4800</option>
                    <option value="9600">9600</option>
                    <option value="14400">14400</option>
                    <option value="19200">19200</option>
                    <option value="38400">38400</option>
                    <option value="56000">56000</option>
                    <option value="57600">57600</option>
                    <option value="115200" selected>115200</option>
                    <option value="128000">128000</option>
                    <option value="256000">256000</option>
                    <option value="460800">460800</option>
                    <option value="512000">512000</option>
                    <option value="921600">921600</option>
                    <option value="1000000">1000000</option>
                    <option value="2000000">2000000</option>
                    <option value="custom">Custom...</option>
                </select>
                <div id="baud-custom-wrapper" style="display: none; display: flex; gap: 4px;">
                    <input type="number" id="baud-custom-input" placeholder="Baud Rate" data-i18n-placeholder="main.customBaudRate" style="flex: 1; width: 0;">
                    <button id="baud-custom-cancel" class="secondary" style="width: auto; padding: 0 6px;" title="Back to list" data-i18n-title="main.backToList"><span class="material-icon-placeholder" data-material-icon="close"></span></button>
                </div>
            </div>

            <button id="connect-btn" class="connect-action" style="width: 100%;"><span class="material-icon-placeholder" data-material-icon="power"></span><span id="connect-btn-label" data-i18n="main.connect">Connect</span></button>
            <button id="clear-btn" class="secondary" title="Clear Terminal Output" data-i18n-title="main.clearTerminalOutput" style="width: 100%;"><span class="material-icon-placeholder" data-material-icon="delete_sweep"></span><span data-i18n="main.clearLog">Clear Log</span></button>
            <div class="sidebar-log-actions">
                <button id="open-log-folder-btn" class="secondary" type="button"><span class="material-icon-placeholder" data-material-icon="folder_open"></span><span data-i18n="main.openLogFolder">Open Log Folder</span></button>
                <button id="save-current-tab-btn" class="secondary" type="button" title="Save Current Tab" data-i18n-title="main.saveCurrentTab" aria-label="Save Current Tab" data-i18n-aria-label="main.saveCurrentTab"><span class="material-icon-placeholder" data-material-icon="save"></span></button>
            </div>
        </div>

        <!-- Tabs Header -->
        <div class="sidebar-tabs" role="tablist">
            <button class="sidebar-tab active" type="button" data-target="tab-settings" role="tab" aria-controls="tab-settings" aria-selected="true" aria-label="Settings" data-i18n-aria-label="main.settingsTab" title="Settings" data-i18n-title="main.settingsTab"><span class="material-icon-placeholder" data-material-icon="tune"></span></button>
            <button class="sidebar-tab" type="button" data-target="tab-search" role="tab" aria-controls="tab-search" aria-selected="false" aria-label="Search" data-i18n-aria-label="main.searchTab" title="Search" data-i18n-title="main.searchTab"><span class="material-icon-placeholder" data-material-icon="search"></span></button>
            <button class="sidebar-tab" type="button" data-target="tab-send" role="tab" aria-controls="tab-send" aria-selected="false" aria-label="Send" data-i18n-aria-label="main.sendTab" title="Send" data-i18n-title="main.sendTab"><span class="material-icon-placeholder" data-material-icon="send"></span></button>
        </div>

        <!-- Tab Content -->
        <div class="sidebar-content">
            <!-- Settings Tab -->
            <div id="tab-settings" class="sidebar-tab-pane active" role="tabpanel">
                <select id="data-bits-select" title="Data Bits" data-i18n-title="main.dataBits8">
                    <option value="8" selected>Data Bits: 8</option>
                    <option value="7">Data Bits: 7</option>
                    <option value="6">Data Bits: 6</option>
                    <option value="5">Data Bits: 5</option>
                </select>

                <select id="stop-bits-select" title="Stop Bits" data-i18n-title="main.stopBits1">
                    <option value="1" selected>Stop Bits: 1</option>
                    <option value="1.5">Stop Bits: 1.5</option>
                    <option value="2">Stop Bits: 2</option>
                </select>

                <select id="parity-select" title="Parity" data-i18n-title="main.parityNone">
                    <option value="none" selected>Parity: None</option>
                    <option value="even">Parity: Even</option>
                    <option value="odd">Parity: Odd</option>
                    <option value="mark">Parity: Mark</option>
                    <option value="space">Parity: Space</option>
                </select>

                <div class="serial-mode-grid" aria-label="Serial receive settings" data-i18n-aria-label="main.serialDataModes">
                    <span class="serial-mode-label" data-i18n="main.receiveShort" data-i18n-fallback="RX">RX</span>
                    <select id="receive-mode-select" title="Receive display mode" data-i18n-title="main.receiveDisplayMode">
                        <option value="text" data-i18n="main.textMode" data-i18n-fallback="Text">Text</option>
                        <option value="hex" data-i18n="main.hexMode" data-i18n-fallback="Hex">Hex</option>
                    </select>
                    <select id="receive-encoding-select" title="Receive encoding" data-i18n-title="main.receiveEncoding">
                        <option value="utf8">UTF-8</option><option value="ascii">ASCII</option><option value="gbk">GBK</option>
                    </select>
                </div>

                <select id="newline-mode-select" title="Newline Mode (Receive/Send)" data-i18n-title="main.newlineCrlf">
                    <option value="crlf" selected>NL: CRLF / CRLF</option>
                    <option value="lf">NL: LF / LF</option>
                    <option value="cr">NL: CR / CR</option>
                </select>

                <div class="serial-mode-grid serial-send-encoding">
                    <label class="serial-mode-label" for="send-encoding-select" data-i18n="main.sendShort" data-i18n-fallback="TX">TX</label>
                    <select id="send-encoding-select" title="Send encoding" data-i18n-title="main.sendEncoding">
                        <option value="utf8">UTF-8</option><option value="ascii">ASCII</option><option value="gbk">GBK</option>
                    </select>
                </div>

                <div id="display-controls" class="settings-group">
                    <label>
                        <input type="checkbox" id="show-timestamp"> <span class="material-icon-placeholder" data-material-icon="schedule"></span><span data-i18n="main.showTime">Show Time</span>
                    </label>
                    <label>
                        <input type="checkbox" id="show-lineno"> <span class="material-icon-placeholder" data-material-icon="format_list_numbered"></span><span data-i18n="main.showLineNo">Show Line #</span>
                    </label>
                </div>
            </div>

            <!-- Search Tab -->
            <div id="tab-search" class="sidebar-tab-pane" role="tabpanel">
                <input type="text" id="search-input" placeholder="Search..." data-i18n-placeholder="main.searchPlaceholder" style="margin-bottom: 4px;">
                <div id="search-target-label" class="search-target-label"></div>
                <div style="display: flex; gap: 4px;">
                    <button id="find-prev-btn" style="flex: 1;" data-i18n="main.prev">Prev</button>
                    <button id="find-next-btn" style="flex: 1;" data-i18n="main.next">Next</button>
                </div>
                <div id="search-result-count" class="search-result-count" data-i18n="main.searchResultEmpty">No results</div>
                <label style="margin-top: 4px;">
                    <input type="checkbox" id="search-regex"> <span class="material-icon-placeholder" data-material-icon="regular_expression"></span><span data-i18n="main.regex">Regex</span>
                </label>
                <label>
                    <input type="checkbox" id="search-case"> <span class="material-icon-placeholder" data-material-icon="match_case"></span><span data-i18n="main.caseSensitive">Case Sensitive</span>
                </label>
                <label>
                    <input type="checkbox" id="search-word"> <span class="material-icon-placeholder" data-material-icon="match_word"></span><span data-i18n="main.wholeWord">Whole Word</span>
                </label>
            </div>

            <!-- Send Tab -->
            <div id="tab-send" class="sidebar-tab-pane" role="tabpanel">
                <!-- Auto Send -->
                <section class="send-sidebar-section">
                    <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
                        <input type="checkbox" id="auto-send-enable">
                        <label for="auto-send-enable" style="font-size: 13px; color: var(--text-primary); cursor: pointer; display: inline;" data-i18n="main.autoSend">Auto Send</label>
                        <input type="number" id="auto-send-interval" placeholder="ms" value="1000" style="width: 60px; padding: 4px; margin-left: auto;">
                        <span class="auto-send-interval-unit" aria-hidden="true">ms</span>
                    </div>
                    <textarea id="auto-send-text" placeholder="Text to auto send..." data-i18n-placeholder="main.autoSendText" class="send-editor-textarea"></textarea>
                    <div id="auto-send-validation" class="input-validation" role="status" aria-live="polite"></div>
                </section>
        
                <!-- Quick Send -->
                <div style="font-size: 13px; margin-bottom: 4px; color: var(--text-primary); display: flex; justify-content: space-between; align-items: center;">
                    <span data-i18n="main.quickSendList">Quick Send List</span>
                </div>
                <div id="quick-send-list" class="quick-send-list-container">
                    <!-- Items will be added here -->
                </div>
                <button id="open-quick-send-dialog-btn" class="secondary quick-send-add-btn"><span class="material-icon-placeholder" data-material-icon="add"></span><span data-i18n="main.addToList">Add to List</span></button>
            </div>
        </div>

        <div class="throughput-panel" id="throughput-panel">
            <div class="throughput-row">
                <div class="throughput-charts-stack">
                    <div class="throughput-chart" id="throughput-rx-chart"></div>
                    <div class="throughput-chart" id="throughput-tx-chart"></div>
                </div>
                <div class="throughput-rates-stack">
                    <div class="throughput-rate-group">
                        <div class="throughput-label" data-i18n="main.rx">RX</div>
                        <div class="throughput-rate" id="throughput-rx-rate">0 B/s</div>
                    </div>
                    <div class="throughput-rate-group">
                        <div class="throughput-label" data-i18n="main.tx">TX</div>
                        <div class="throughput-rate" id="throughput-tx-rate">0 B/s</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="sidebar-footer-row">
                <button id="sidebar-collapse-btn" class="footer-btn settings" title="Collapse sidebar" data-i18n-title="main.collapseSidebar" aria-label="Collapse sidebar"><span class="material-icon-placeholder" data-material-icon="chevron_left"></span></button>
                <button id="open-prefs" class="footer-btn settings" type="button" aria-label="Settings" data-i18n-aria-label="main.globalSettings" title="Settings" data-i18n-title="main.globalSettings">
                    <span class="material-icon-placeholder" data-material-icon="settings"></span>
                </button>
                <button id="toggle-main-input" class="footer-btn settings" type="button" aria-label="Show or hide input" data-i18n-aria-label="main.toggleInputHide" title="显示/隐藏输入框" data-i18n-title="main.toggleInputHide">
                    <span class="material-icon-placeholder" data-material-icon="keyboard"></span>
                </button>
                <button id="toggle-shell-sidebar" class="footer-btn settings" type="button" aria-label="Shell Panel" data-i18n-aria-label="main.shellPanel" title="Shell Panel" data-i18n-title="main.shellPanel">
                    <span class="material-icon-placeholder" data-material-icon="terminal"></span>
                </button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="workspace-root" id="workspace-root">
            <div class="workspace-pane active" id="pane-1" data-pane-id="pane-1">
                <div class="main-tabs-header pane-tabs-header">
                    <div class="main-tabs-list pane-tabs-list" id="pane-1-tabs-list" role="tablist">
                        <button class="main-tab active" id="tab-main-button" type="button" role="tab" aria-controls="tab-main" aria-selected="true" data-target="tab-main" data-pane-id="pane-1" data-i18n="main.mainTerminal">Main Terminal</button>
                    </div>
                    <div class="pane-tab-actions">
                        <button id="pane-1-new-shell-tab-btn" class="secondary pane-new-tab-btn" title="New Shell Tab" data-i18n-title="main.newShellTab"><span class="material-icon-placeholder" data-material-icon="terminal"></span></button>
                        <button id="pane-1-new-filter-tab-btn" class="secondary pane-new-tab-btn" title="New Filter Tab" data-i18n-title="main.newFilterTab"><span class="material-icon-placeholder" data-material-icon="filter_alt"></span></button>
                    </div>
                </div>
                <div class="main-tabs-content pane-tabs-content" id="pane-1-tabs-content">
                    <div class="main-tab-pane active" id="tab-main" data-pane-id="pane-1" role="tabpanel" aria-labelledby="tab-main-button">
                        <div class="terminal-wrapper" id="serial-container"></div>
                    </div>
                </div>
            </div>
            <div class="workspace-splitter" id="workspace-splitter" hidden></div>
            <div class="workspace-pane" id="pane-2" data-pane-id="pane-2" hidden>
                <div class="main-tabs-header pane-tabs-header">
                    <div class="main-tabs-list pane-tabs-list" id="pane-2-tabs-list" role="tablist"></div>
                    <div class="pane-tab-actions">
                        <button id="pane-2-new-shell-tab-btn" class="secondary pane-new-tab-btn" title="New Shell Tab" data-i18n-title="main.newShellTab"><span class="material-icon-placeholder" data-material-icon="terminal"></span></button>
                        <button id="pane-2-new-filter-tab-btn" class="secondary pane-new-tab-btn" title="New Filter Tab" data-i18n-title="main.newFilterTab"><span class="material-icon-placeholder" data-material-icon="filter_alt"></span></button>
                    </div>
                </div>
                <div class="main-tabs-content pane-tabs-content" id="pane-2-tabs-content"></div>
            </div>
        </div>
        <div class="main-input-panel" id="main-input-panel">
            <div class="main-input-row">
                <button id="main-input-history-btn" class="secondary main-input-history-btn" title="发送历史" data-i18n-title="main.sendHistory"><span class="material-icon-placeholder" data-material-icon="history"></span></button>
                <textarea id="main-send-input" placeholder="输入要发送的内容..." data-i18n-placeholder="main.sendInputPlaceholder" rows="1"></textarea>
                <button id="main-send-btn" title="发送" data-i18n-title="main.send"><span data-i18n="main.send">Send</span></button>
                <button id="main-add-quick-send-btn" class="secondary" title="加入快捷发送" data-i18n-title="main.addToQuickSend"><span class="material-icon-placeholder" data-material-icon="add"></span><span data-i18n="main.addQuickSendShort">Quick</span></button>
                <label class="main-input-icon-toggle main-input-text-toggle" for="main-send-hex" title="十六进制发送" data-i18n-title="main.hexMode">
                    <input type="checkbox" id="main-send-hex">
                    <span>HEX</span>
                </label>
                <label class="main-input-icon-toggle main-input-text-toggle" for="main-send-append-crlf" title="追加 CRLF" data-i18n-title="main.appendCrlf">
                    <input type="checkbox" id="main-send-append-crlf">
                    <span>CRLF</span>
                </label>
                <label class="main-input-icon-toggle" for="main-send-on-enter" title="按回车发送" data-i18n-title="main.sendOnEnterToggle" aria-label="Input settings">
                    <input type="checkbox" id="main-send-on-enter" checked>
                    <span class="material-icon-placeholder" data-material-icon="keyboard_return"></span>
                </label>
            </div>
            <div class="main-input-meta-row">
                <div class="input-validation" id="main-input-validation" role="status" aria-live="polite"></div>
                <div class="main-input-last" id="main-send-last" data-i18n="main.lastSentNone">上一条发送：暂无</div>
                <div class="main-action-status" id="main-action-status">就绪</div>
            </div>
            <div class="main-input-history-menu hidden" id="main-input-history-menu"></div>
        </div>
    </div>

    <!-- Right Shell Sidebar -->
    <div class="shell-sidebar hidden" id="shell-sidebar">
        <div class="shell-sidebar-header">
            <span class="shell-sidebar-title" data-i18n="main.shellPanel">Shell Panel</span>
            <button class="shell-sidebar-close-btn" id="shell-sidebar-close-btn" title="Close Shell Panel" data-i18n-title="main.closeShellPanel"><span class="material-icon-placeholder" data-material-icon="close"></span></button>
        </div>
        <div class="shell-sidebar-content">
            <div class="shell-sidebar-section">
                <div class="shell-sidebar-section-title" data-i18n="main.newShellSession">New Shell Session</div>
                <div class="shell-sidebar-btn-group" id="shell-profile-btns">
                    <!-- Dynamically populated from shell profiles -->
                </div>
                <button id="shell-manage-profiles-btn" class="secondary" style="width: 100%; margin-top: 4px; font-size: 12px;" title="Manage Shell Profiles" data-i18n-title="main.manageShellProfiles">
                    <span data-i18n="main.manageShellProfiles">Manage Profiles...</span>
                </button>
            </div>
            <div class="shell-sidebar-section">
                <div class="shell-sidebar-section-title" data-i18n="main.activeShellSessions">Active Sessions</div>
                <div class="shell-session-list" id="shell-session-list">
                    <div class="shell-session-empty" data-i18n="main.noActiveShellSessions">No active shell sessions</div>
                </div>
            </div>
            <div class="shell-sidebar-section">
                <div class="shell-sidebar-section-title" data-i18n="main.shellOptions">Shell Options</div>
                <div class="shell-options-group">
                    <label>
                        <input type="checkbox" id="shell-auto-crlf" checked>
                        <span data-i18n="main.shellAutoCRLF">Auto CRLF on Enter</span>
                    </label>
                    <label>
                        <input type="checkbox" id="shell-clear-on-restart">
                        <span data-i18n="main.shellClearOnRestart">Clear on Restart</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="quick-send-dialog" class="app-dialog-overlay hidden" role="presentation">
        <section class="app-dialog quick-send-dialog" role="dialog" aria-modal="true" aria-labelledby="quick-send-dialog-title">
            <header class="app-dialog-header">
                <h2 id="quick-send-dialog-title" data-i18n="main.addQuickSend">Add Quick Send</h2>
                <button id="quick-send-dialog-close" class="app-dialog-close" type="button" aria-label="Close" data-i18n-title="main.close"><span class="material-icon-placeholder" data-material-icon="close"></span></button>
            </header>
            <div class="app-dialog-body">
                <div class="form-group">
                    <label for="quick-send-label" data-i18n="main.label">Label</label>
                    <input type="text" id="quick-send-label" placeholder="Label" data-i18n-placeholder="main.label">
                </div>
                 <div class="form-group">
                     <label for="quick-send-content" data-i18n="main.content">Content</label>
                     <textarea id="quick-send-content" placeholder="Content (multi-line)" data-i18n-placeholder="main.contentMultiLine" class="send-editor-textarea"></textarea>
                 </div>
                  <div class="form-group quick-send-mode-field">
                     <span class="quick-send-field-label" data-i18n="main.quickSendMode">Quick send mode</span>
                     <div class="quick-send-mode-control" role="radiogroup" aria-label="Quick send mode" data-i18n-aria-label="main.quickSendMode">
                         <label><input type="radio" name="quick-send-mode" value="text" checked><span data-i18n="main.textMode">Text</span></label>
                         <label><input type="radio" name="quick-send-mode" value="hex"><span data-i18n="main.hexMode">Hex</span></label>
                      </div>
                  </div>
                  <div class="form-group quick-send-options">
                      <label class="quick-trigger-check" for="quick-send-append-crlf">
                          <input type="checkbox" id="quick-send-append-crlf">
                          <span data-i18n="main.appendCrlf">Append CRLF</span>
                      </label>
                  </div>
                 <section class="form-group quick-sidebar-settings" aria-label="Sidebar shortcut settings" data-i18n-aria-label="main.quickSidebarSettings">
                     <label class="quick-sidebar-toggle" for="quick-send-sidebar-enable">
                         <input type="checkbox" id="quick-send-sidebar-enable">
                         <span data-i18n="main.addToSidebar">Add to collapsed sidebar</span>
                     </label>
                     <div id="quick-send-sidebar-controls" class="quick-sidebar-controls">
                         <label class="quick-sidebar-text-field" for="quick-send-sidebar-text">
                             <span data-i18n="main.sidebarShortcutText">Shortcut text</span>
                             <input type="text" id="quick-send-sidebar-text" placeholder="Shortcut text" data-i18n-placeholder="main.sidebarShortcutText">
                         </label>
                         <label class="quick-sidebar-color-field" for="quick-send-sidebar-color">
                             <span data-i18n="main.sidebarShortcutColor">Background color</span>
                             <input type="color" id="quick-send-sidebar-color" value="#333333">
                         </label>
                     </div>
                 </section>
                 <section class="form-group quick-trigger-settings" aria-label="Auto trigger settings" data-i18n-aria-label="main.quickTriggerSettings">
                    <label class="quick-trigger-check" for="quick-send-trigger-enable">
                        <input type="checkbox" id="quick-send-trigger-enable">
                        <span data-i18n="main.quickSendAutoTrigger">Auto Trigger</span>
                    </label>
                    <div class="form-group">
                        <label for="quick-send-trigger-text" data-i18n="main.quickTriggerText">Match text</label>
                        <input type="text" id="quick-send-trigger-text" placeholder="READY" data-i18n-placeholder="main.quickTriggerTextPlaceholder">
                    </div>
                    <div class="quick-trigger-options">
                        <label class="quick-trigger-check"><input type="checkbox" id="quick-send-trigger-regex"> <span data-i18n="main.regex">Regex</span></label>
                        <label class="quick-trigger-check"><input type="checkbox" id="quick-send-trigger-case"> <span data-i18n="main.caseSensitive">Case Sensitive</span></label>
                        <label class="quick-trigger-check"><input type="checkbox" id="quick-send-trigger-word"> <span data-i18n="main.wholeWord">Whole Word</span></label>
                    </div>
                </section>
                <div id="quick-send-validation" class="input-validation" role="status" aria-live="polite"></div>
            </div>
            <footer class="app-dialog-actions">
                <button id="quick-send-dialog-cancel" type="button" class="secondary" data-i18n="main.cancel">Cancel</button>
                <button id="add-quick-send-btn" type="button"><span class="material-icon-placeholder" data-material-icon="add"></span><span data-i18n="main.addToList">Add to List</span></button>
            </footer>
        </section>
    </div>

    <div id="rename-tab-dialog" class="app-dialog-overlay hidden" role="presentation">
        <section class="app-dialog rename-tab-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-tab-dialog-title">
            <header class="app-dialog-header">
                <h2 id="rename-tab-dialog-title" data-i18n="main.renameTab">Rename Tab</h2>
                <button id="rename-tab-dialog-close" class="app-dialog-close" type="button" aria-label="Close" data-i18n-title="main.close"><span class="material-icon-placeholder" data-material-icon="close"></span></button>
            </header>
            <div class="app-dialog-body">
                <div class="form-group">
                    <label for="rename-tab-input" data-i18n="main.tabName">Tab Name</label>
                    <input type="text" id="rename-tab-input" autocomplete="off" data-i18n-placeholder="main.tabName">
                </div>
            </div>
            <footer class="app-dialog-actions">
                <button id="rename-tab-dialog-cancel" type="button" class="secondary" data-i18n="main.cancel">Cancel</button>
                <button id="rename-tab-dialog-save" type="button" data-i18n="main.save">Save</button>
            </footer>
        </section>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
